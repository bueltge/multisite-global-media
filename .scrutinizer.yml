build:
  image: default-jammy
  environment:
    php:
      version: 8.3
      ini:
        xdebug.mode: coverage
    variables:
      XDEBUG_MODE: coverage
  dependencies:
    before:
      - composer self-update --2
    override:
      - composer install --no-interaction --prefer-dist
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
    tests:
      tests:
        override:
          - command: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage/clover.xml
            coverage:
              file: coverage/clover.xml
              format: clover

filter:
  excluded_paths:
    - 'tests/*'
    - 'assets/*'
    - 'docker/*'
    - 'scripts/*'
  dependency_paths:
    - 'vendor/'